# AWS App Runner Configuration
# Deploy: aws apprunner create-service --cli-input-yaml file://apprunner.yaml

version: 1.0
runtime: nodejs20

build:
  commands:
    pre-build:
      - npm ci
      - npx prisma generate
    build:
      - npm run build
  env:
    - name: NODE_ENV
      value: "production"

run:
  command: node dist/index.js
  network:
    port: 8080
    env: PORT
  env:
    - name: NODE_ENV
      value: "production"
