# ============================================================================
# Railway Configuration - Traductor Auth Server
# ============================================================================
# Deploy: railway up
# Logs: railway logs
# ============================================================================

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
